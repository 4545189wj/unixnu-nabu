name: Nabu 21H16 read-only kernel

on:
  push:
    branches: [nabu-21h16-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Check out Nabu
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check out UniXNU core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/UniXNU
          ref: b6de3eb11f0b0118dfc14fad6eefc884a3b69737
          path: .ci-src/UniXNU
          persist-credentials: false

      - name: Check out SM8150 support
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zzweiqing/UniXNU-sm8150-common
          ref: f363dcda920101a99e440ce3e8b68849122a3c0a
          path: .ci-src/sm8150
          persist-credentials: false

      - name: Apply 21H16 source changes
        run: |
          git -C .ci-src/UniXNU apply "$GITHUB_WORKSPACE/ci/21h16/unixnu-21h16.patch"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Set up kernel tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install llvm lld
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi

      - name: Configure and build read-only kernel
        working-directory: .ci-src/UniXNU
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          board_args=(-D "$GITHUB_WORKSPACE/ci/21h16/device" --local-module "soc:sm8150=$GITHUB_WORKSPACE/.ci-src/sm8150")
          ./unixnu defconfig nabu_ufs_readonly_defconfig "${board_args[@]}"
          ./unixnu build kernel "${board_args[@]}"

      - name: Audit linked read-only UFS ABI
        id: audit
        working-directory: .ci-src/UniXNU
        run: |
          work=$(./unixnu status --json -D "$GITHUB_WORKSPACE/ci/21h16/device" \
            --local-module "soc:sm8150=$GITHUB_WORKSPACE/.ci-src/sm8150" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["output"])')
          echo "work=$work" >> "$GITHUB_OUTPUT"
          python3 "$work/tree/scripts/build-nabu-ufs-readonly.py" \
            --check-candidate "$work/kernel/kernel.macho" \
            --object "$work/tree/build/native-ufs/NativeUfs.o" \
            --prelink-report "$work/kernel/kernel.json" \
            --output-dir "$work/kernel"
          python3 - "$work/kernel/candidate-bindings.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text())
          print(f"Read-only UFS ABI {report['readonly_abi']}: "
                f"{report['linked_block_slots_checked']} linked virtual slots, "
                f"{report['inherited_slots_checked']} inherited slots, "
                f"{len(report['linked_symbols'])} required symbols verified.")
          PY

      - name: Build UEFI loader and verify XNU entry in QEMU
        working-directory: .ci-src/UniXNU
        env:
          KERNEL_WORK: ${{ steps.audit.outputs.work }}
        run: |
          brew install qemu
          export PATH="$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"
          board_args=(-D "$GITHUB_WORKSPACE/ci/21h16/device" --local-module "soc:sm8150=$GITHUB_WORKSPACE/.ci-src/sm8150")
          ./unixnu build package "${board_args[@]}"
          UNIXNU_EDK2="$KERNEL_WORK/tree/refer/edk2" \
            bash "$KERNEL_WORK/tree/scripts/build-darwinboot.sh"
          python3 "$GITHUB_WORKSPACE/ci/21h16/qemu-entry.py" \
            --core "$PWD" --work "$KERNEL_WORK" --output "$RUNNER_TEMP/qemu-entry"
