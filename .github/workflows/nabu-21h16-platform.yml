name: Nabu 21H16 platform diagnostic

on:
  push:
    branches: [nabu-21h16-ci]
    paths:
      - "ci/21h16/platform/**"
      - ".github/workflows/nabu-21h16-platform.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Check out Nabu
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check out UniXNU core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/UniXNU
          ref: b6de3eb11f0b0118dfc14fad6eefc884a3b69737
          path: .ci-src/UniXNU
          persist-credentials: false

      - name: Check out SM8150 support
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zzweiqing/UniXNU-sm8150-common
          ref: f363dcda920101a99e440ce3e8b68849122a3c0a
          path: .ci-src/sm8150
          persist-credentials: false

      - name: Apply 21H16 source changes
        run: |
          git -C .ci-src/UniXNU apply "$GITHUB_WORKSPACE/ci/21h16/unixnu-21h16.patch"
          git -C .ci-src/UniXNU apply "$GITHUB_WORKSPACE/ci/21h16/platform/adt-timer.patch"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Set up kernel tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install llvm lld dtc mtools
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi

      - name: Build and verify nabu platform payload
        working-directory: .ci-src/UniXNU
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          platform="$GITHUB_WORKSPACE/ci/21h16/platform"
          ln -s ../device/scripts "$platform/scripts"
          ln -s ../device/feeds.toml "$platform/feeds.toml"
          board_args=(-D "$platform" --local-module "soc:sm8150=$GITHUB_WORKSPACE/.ci-src/sm8150")
          ./unixnu defconfig nabu_bootstrap_defconfig "${board_args[@]}"
          ./unixnu build kernel payload "${board_args[@]}" --unique-chip-id 1
          work=$(./unixnu status --json "${board_args[@]}" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["output"])')
          mcopy -i "$work/payload/payload.img" ::/EFI/UniXNU/Payloads/kernel.macho.adt "$RUNNER_TEMP/platform-test.adt"
          python3 "$platform/check-adt.py" "$RUNNER_TEMP/platform-test.adt" "$work/kernel/kernel.macho"

  initrd-firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out diagnostic sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check out UniXNU core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/UniXNU
          ref: b6de3eb11f0b0118dfc14fad6eefc884a3b69737
          path: .ci-src/UniXNU
          persist-credentials: false

      - name: Check out SM8150 support
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zzweiqing/UniXNU-sm8150-common
          ref: f363dcda920101a99e440ce3e8b68849122a3c0a
          path: .ci-src/sm8150
          persist-credentials: false

      - name: Check out the nabu UEFI reference
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: 3214791900-del/uefi-nabu-build
          ref: 274a0e1d1cbe3489130d9b1dc9c1f8ff1244372a
          path: .ci-src/uefi
          submodules: recursive
          persist-credentials: false

      - name: Fetch and verify pinned Mu release assets
        working-directory: .ci-src/uefi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets="$RUNNER_TEMP/mu-assets"
          mkdir -p "$assets"
          fetch_asset() {
            curl -fsSL --retry 2 --max-time 90 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/$1/releases/assets/$2" -o "$assets/$3"
            printf '%s  %s\n' "$4" "$assets/$3" | sha256sum -c -
          }
          fetch_asset microsoft/mu_basecore 538543176 basetools.tar.gz \
            aaf0654218f1705c25d2109de8e6040f8615b71bfdc0fcfb3ae27616f949a8a0
          fetch_asset microsoft/mu_crypto_release 604163431 OneCrypto-Accelerated.zip \
            c42f8d950b5546a062e3c652f3a23c4d12bbfa8a40d967a02367c5d614763661
          python3 - "$assets" <<'PY'
          import sys
          from pathlib import Path

          assets = Path(sys.argv[1])
          replacements = {
              "BaseTools/Bin/basetoolsbin_ext_dep.yaml": (
                  "https://github.com/microsoft/mu_basecore/releases/download/v2026080000.0.0-rc0/basetools-v2026080000.0.0-rc0.tar.gz",
                  "basetools.tar.gz",
              ),
              "CryptoPkg/Binaries/OneCrypto_ext_dep.json": (
                  "https://github.com/microsoft/mu_crypto_release/releases/download/v1.1.2-OneCrypto/OneCrypto-Accelerated.zip",
                  "OneCrypto-Accelerated.zip",
              ),
          }
          for name, (source, filename) in replacements.items():
              descriptor = Path("Mu_Basecore") / name
              data = descriptor.read_bytes()
              if data.count(source.encode()) != 1:
                  raise SystemExit(f"Unexpected pinned source URL in {name}")
              descriptor.write_bytes(data.replace(source.encode(), (assets / filename).as_uri().encode()))
          PY

      - name: Build the UEFI firmware with read-only initrd and menu logs
        working-directory: .ci-src/uefi
        run: |
          platform="$GITHUB_WORKSPACE/ci/21h16/platform"
          core="$GITHUB_WORKSPACE/.ci-src/UniXNU"
          git apply --ignore-space-change "$platform/uefi-initrd.patch"
          git apply --ignore-space-change "$platform/uefi-advanced-logger.patch"
          cmp "$core/package/UniXNUPkg/Include/Protocol/UniXNULoader.h" \
            UniXNU/package/UniXNUPkg/Include/Protocol/UniXNULoader.h
          cp -R "$core/package/UniXNUPkg/." UniXNU/package/UniXNUPkg/
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mtools
          bash ./setup_env.sh -p apt
          export CLANGPDB_AARCH64_PREFIX=aarch64-linux-gnu-
          find Resources -name '*.patch' -exec sed -i 's/\r$//' {} +
          grep -h '^+++ b/' Resources/MuPatches/*.patch | sed 's|^+++ b/||' | sort -u | while read -r f; do
            if [ -f "Mu_Basecore/$f" ]; then sed -i 's/\r$//' "Mu_Basecore/$f"; fi
          done
          MTOOLS_SKIP_CHECK=1 mformat -C -F -T 131072 -v NABUTEST -i "$RUNNER_TEMP/synthetic-initrd.img" ::
          cp "$RUNNER_TEMP/synthetic-initrd.img" Resources/ramdisk
          python3 ./build_uefi.py -d nabu -r DEBUG -c
          fv=Build/nabuPkg/DEBUG_CLANGPDB/FV/FVMAIN.Fv.txt
          grep -iF '75CA63AD-FBAE-4A06-92A0-F937C671251D' "$fv"
          grep -iF '8D4E7F50-3A2C-4C9A-9E1B-50C4C8472D41' "$fv"

      - name: Verify firmware-only and synthetic FAT boot images
        working-directory: .ci-src/UniXNU
        run: |
          platform="$GITHUB_WORKSPACE/ci/21h16/platform"
          uefi="$GITHUB_WORKSPACE/.ci-src/uefi"
          git apply "$GITHUB_WORKSPACE/ci/21h16/unixnu-21h16.patch"
          verify_bootimg() {
            local output="$1" ramdisk="$2" expected_bytes="$3"
            ./unixnu bootimg -D "$platform" --local-module "soc:sm8150=$GITHUB_WORKSPACE/.ci-src/sm8150" \
              --uefi "$uefi" --fd "$uefi/Build/nabuPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd" \
              --dtb "$uefi/Resources/DTBs/nabu.dtb" --ramdisk "$ramdisk" \
              --output "$output/boot.img"
            python3 - "$output/boot.json" "$expected_bytes" <<'PY'
          import json, sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text())
          assert report["header_version"] == 1 and report["ramdisk_bytes"] == int(sys.argv[2])
          print(f'Boot image verified: {report["ramdisk_bytes"]} ramdisk bytes, SHA-256 {report["image_sha256"]}')
          PY
          }
          verify_bootimg "$RUNNER_TEMP/nabu-uefi-only" none 0
          verify_bootimg "$RUNNER_TEMP/nabu-firmware-fixture" "$uefi/Resources/ramdisk" $((64 * 1024 * 1024))

      - name: Set up the UniXNU Linux kernel toolchain
        working-directory: .ci-src/UniXNU
        run: sudo python3 scripts/linux/setup-toolchain.py --package-manager apt -j "$(nproc)"

      - name: Verify the boot image with the nabu platform payload
        working-directory: .ci-src/UniXNU
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          platform="$GITHUB_WORKSPACE/ci/21h16/platform"
          uefi="$GITHUB_WORKSPACE/.ci-src/uefi"
          git apply "$platform/adt-timer.patch"
          ln -s ../device/scripts "$platform/scripts"
          ln -s ../device/feeds.toml "$platform/feeds.toml"
          board_args=(-D "$platform" --local-module "soc:sm8150=$GITHUB_WORKSPACE/.ci-src/sm8150")
          ./unixnu defconfig nabu_bootstrap_defconfig "${board_args[@]}"
          # Synthetic platform seed for CI only.
          ./unixnu build kernel payload "${board_args[@]}" --unique-chip-id 1
          work=$(./unixnu status --json "${board_args[@]}" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["output"])')
          payload="$work/payload/payload.img"
          mcopy -i "$payload" ::/EFI/UniXNU/Payloads/kernel.macho "$RUNNER_TEMP/platform-test.macho"
          mcopy -i "$payload" ::/EFI/UniXNU/Payloads/kernel.macho.adt "$RUNNER_TEMP/platform-test.adt"
          cmp "$work/kernel/kernel.macho" "$RUNNER_TEMP/platform-test.macho"
          python3 "$platform/check-adt.py" "$RUNNER_TEMP/platform-test.adt" "$RUNNER_TEMP/platform-test.macho"
          image_dir="$RUNNER_TEMP/nabu-platform"
          mkdir -p "$image_dir"
          ./unixnu bootimg "${board_args[@]}" \
            --uefi "$uefi" --fd "$uefi/Build/nabuPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd" \
            --dtb "$uefi/Resources/DTBs/nabu.dtb" --ramdisk "$payload" \
            --output "$image_dir/boot.img"
          python3 - "$image_dir/boot.json" <<'PY'
          import json, sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text())
          assert report["header_version"] == 1 and report["ramdisk_bytes"] == 64 * 1024 * 1024
          print(f'Nabu platform boot image verified: {report["image_bytes"]} bytes, SHA-256 {report["image_sha256"]}')
          PY
